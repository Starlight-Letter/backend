services:
  db:
    image: postgres:16-alpine
    container_name: starlight-postgres
    restart: always
    environment:
      POSTGRES_DB: starlight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 서버 안(127.0.0.1)에서만 연다. 백엔드는 Docker 내부 네트워크(db:5432)로 붙으니 외부 공개가 필요 없고,
    # DB 툴은 SSH 터널로 접속한다. 보안 그룹 설정 실수 하나로 DB가 인터넷에 노출되지 않게 한다.
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: .
    container_name: starlight-backend
    restart: always
    depends_on:
      - db
    ports:
      - "3000:3000"
    # 비밀 값(DB 비밀번호, 운영자 TOTP 키·계정)은 이 파일에 직접 쓰지 않는다. 서버의 같은 폴더에 있는 .env(git 제외)에 두면
    # docker compose가 ${이름} 자리에 채워 넣는다. 필요한 값: DB_PASSWORD, ADMIN_TOTP_KEY, ADMIN_NICKNAME, ADMIN_PASSWORD
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/starlight
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_ALLOWED_ORIGINS: "https://www.starletter.co.kr,https://starletter.co.kr,http://localhost:5173"
      # CloudFront 한 단을 거쳐 들어오므로, 가입 IP 제한이 실제 접속자 IP로 동작하도록 X-Forwarded-For를 한 단계 믿는다.
      APP_TRUSTED_PROXY_HOPS: "1"
      ADMIN_TOTP_KEY: ${ADMIN_TOTP_KEY}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # 비밀번호 해시(Argon2)가 해시마다 쓰는 19MB 네이티브 메모리를 쓰자마자 OS에 돌려주게 한다.
      # 기본 설정이면 glibc가 해제된 큰 블록을 쥐고 있어, 로그인이 몰린 뒤 메모리가 1GB 넘게 남아 스왑에 빠진다(부하 테스트로 확인).
      MALLOC_ARENA_MAX: "2"
      MALLOC_MMAP_THRESHOLD_: "131072"

volumes:
  postgres_data: