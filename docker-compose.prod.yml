services:
  db:
    image: postgres:16-alpine
    container_name: starlight-postgres
    restart: always
    environment:
      POSTGRES_DB: starlight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 서버 안(127.0.0.1)에서만 연다. 백엔드는 Docker 내부 네트워크(db:5432)로 붙으니 외부 공개가 필요 없고,
    # DB 툴은 SSH 터널로 접속한다. 보안 그룹 설정 실수 하나로 DB가 인터넷에 노출되지 않게 한다.
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: .
    container_name: starlight-backend
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/starlight
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # application.yml에서 사용하는 TOTP 키나 암호화 환경변수가 있다면 여기에 추가

volumes:
  postgres_data: